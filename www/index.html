<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Счетчик соплей</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:Impact,"Arial Black",system-ui,sans-serif;font-weight:900;color:#14002e;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3))}
#main{height:100%;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);display:flex;flex-direction:column;text-align:center;touch-action:none}
#head{flex:0 0 auto;display:flex;flex-direction:column;padding-top:3vh}
#ttl{color:var(--ttl);line-height:1;white-space:nowrap;-webkit-text-stroke:2px #14002e;text-shadow:5px 5px 0 #14002e,9px 9px 0 var(--acc)}
#dt{color:#fff;font-size:6.4vw;margin-top:2vh;text-shadow:3px 3px 0 #14002e;white-space:nowrap}
#bw{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#btn{width:min(64vw,32vh);height:min(64vw,32vh);border-radius:50%;border:2.2vw solid #14002e;background:radial-gradient(circle at 35% 30%,var(--btn1),var(--btn2) 75%);box-shadow:0 1.6vh 0 #14002e,0 0 5vh var(--btn1);font:inherit;font-size:min(30vw,15vh);color:#14002e;cursor:pointer}
#btn:active,#btn.hit{transform:translateY(1vh) scale(.95);box-shadow:0 .5vh 0 #14002e,0 0 8vh #fff}
#ch{flex:0 0 27%;min-height:0;background:#14002ecc;border:3px solid var(--line);border-radius:14px;margin:0 0 10px;padding:4px}
#ch svg,.cht svg{width:100%;height:100%;display:block}
#pull{position:fixed;left:50%;top:env(safe-area-inset-top);transform:translate(-50%,-150%);transition:.25s;z-index:5;background:#fff700;color:#14002e;border:4px solid #14002e;border-radius:0 0 22px 22px;padding:2vh 9vw;font:inherit;font-size:7vw;box-shadow:0 6px 0 #14002e}
#pull.on{transform:translate(-50%,0)}
.pane{position:fixed;inset:0;z-index:9;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 24px;background:linear-gradient(160deg,#2b0066,#14002e);color:#fff;touch-action:pan-y}
.pane.on{display:block}
.pane h2{margin:0 0 14px;font-size:9vw;color:var(--ttl);text-shadow:3px 3px 0 var(--acc)}
.b{display:block;width:100%;margin:0 0 14px;padding:3vh 3vw;border:4px solid #14002e;border-radius:18px;font:inherit;font-size:7vw;background:#00e5ff;color:#14002e;box-shadow:0 6px 0 #14002e;text-align:center}
.b.y{background:#fff700}.b.p{background:#ff3d9a;color:#fff}.b.g{background:#b6ff00}
label{display:block;font-size:5.6vw;margin:18px 0 6px;color:#00e5ff}
input[type=text]{width:100%;font:inherit;font-size:9vw;padding:1.5vh 3vw;border-radius:14px;border:4px solid #fff700;background:#14002e;color:#fff700;text-transform:uppercase}
input[type=range]{width:100%;height:7vh;accent-color:#ff0a78}
.row{display:flex;justify-content:space-between;font-size:4.6vw;color:#ffe600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:#ff3d9a;border:3px solid #fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:5vw;color:#fff}
.pl{display:flex;justify-content:space-between;align-items:center}
.pl span:last-child{background:#14002e;border-radius:50%;min-width:12vw;height:12vw;display:flex;align-items:center;justify-content:center;color:#fff700;font-size:6vw;padding:0 8px}
.cht{height:34vh;background:#14002ecc;border:3px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tot{font-size:8vw;color:#b6ff00;margin-bottom:12px}
.dr{display:flex;align-items:center;gap:10px;font-size:5.6vw;margin:8px 0}
.dr i{display:block;height:4vw;background:linear-gradient(90deg,var(--bg1),var(--line));border-radius:4vw;min-width:4px}
.dr b{margin-left:auto;color:#fff700}
.snd{display:flex;justify-content:space-between;align-items:center;padding:2vh 4vw;margin:8px 0;border:4px solid #fff;border-radius:16px;font-size:5.6vw;background:#ffffff14}
.snd.on{background:#b6ff00;color:#14002e;border-color:#14002e}
.del{font-style:normal;background:#ff0a78;color:#fff;border-radius:50%;width:9vw;height:9vw;display:flex;align-items:center;justify-content:center}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.ci{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:4.2vw;background:#ffffff14;border-radius:12px;padding:6px 10px}
.ci input{width:14vw;height:9vw;border:3px solid #fff;border-radius:8px;padding:0;background:none}
</style></head><body>
<div id="main">
 <div id="head"><div id="ttl"></div><div id="dt"></div></div>
 <div id="bw"><button id="btn">0</button></div>
 <div id="ch"></div>
</div>
<button id="pull">☰ МЕНЮ</button>
<div class="pane" id="menu"><h2>МЕНЮ</h2>
 <button class="b y" data-go="settings">⚙ Настройка</button>
 <button class="b g" data-go="archive">🗂 Архив</button>
 <button class="b p" data-go="">✖ Закрыть</button></div>
<div class="pane" id="settings"></div>
<div class="pane" id="archive"></div>
<div class="pane" id="detail"></div>
<script>
var K='emotionpairs.v1';
var D={settings:{player:'',sec:3,pitch:40,sound:'b1'},players:{}};
try{var r=JSON.parse(localStorage.getItem(K)||'null');if(r){D.settings=Object.assign(D.settings,r.settings||{});D.players=r.players||{};}}catch(e){}
var DEFC={bg1:'#ff0a78',bg2:'#7a00ff',bg3:'#00c8ff',ttl:'#ffe600',btn1:'#fff700',btn2:'#b6ff00',line:'#fff700',acc:'#00e5ff'};
D.settings.colors=Object.assign({},DEFC,D.settings.colors||{});
var PRESETS=[{n:'Неон',c:DEFC},
{n:'Огонь',c:{bg1:'#ff1744',bg2:'#ff6d00',bg3:'#ffd600',ttl:'#ffffff',btn1:'#fff59d',btn2:'#ff3d00',line:'#ffffff',acc:'#4a0000'}},
{n:'Токсик',c:{bg1:'#00e676',bg2:'#1b5e20',bg3:'#c6ff00',ttl:'#f4ff81',btn1:'#ff4081',btn2:'#d500f9',line:'#ccff90',acc:'#ff4081'}},
{n:'Океан',c:{bg1:'#00b0ff',bg2:'#2962ff',bg3:'#00e5ff',ttl:'#ffffff',btn1:'#ffee58',btn2:'#ff9100',line:'#ffee58',acc:'#1de9b6'}},
{n:'Ночь',c:{bg1:'#212121',bg2:'#311b92',bg3:'#000000',ttl:'#00e5ff',btn1:'#ff4081',btn2:'#aa00ff',line:'#00e5ff',acc:'#ff4081'}}];
function applyColors(){var c=D.settings.colors,r=document.documentElement.style;for(var k in c)r.setProperty('--'+k,c[k])}
function tint(t){var c=D.settings.colors;return t.replace(/#fff700/g,c.line).replace(/#ff0a78/g,c.bg1).replace(/#00e5ff/g,c.acc)}
function colorUI(){var c=D.settings.colors,L=[['bg1','Фон 1'],['bg2','Фон 2'],['bg3','Фон 3'],['ttl','Заголовок'],['btn1','Кнопка: центр'],['btn2','Кнопка: край'],['line','График'],['acc','Акцент']];
 return '<label>Цвета</label><div class="chips">'+PRESETS.map(function(p,i){return '<button class="chip" data-p="'+i+'">'+p.n+'</button>'}).join('')+'</div><div class="cg">'+
 L.map(function(x){return '<div class="ci"><span>'+x[1]+'</span><input type="color" data-c="'+x[0]+'" value="'+c[x[0]]+'"></div>'}).join('')+'</div><button class="b p" id="rc">↺ СБРОСИТЬ ЦВЕТА</button>'}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var p2=function(n){return(n<10?'0':'')+n};
var dk=function(t){var d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var fmtD=function(k){var a=k.split('-');return a[2]+'.'+a[1]+'.'+a[0].slice(2)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var DAYS=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
function today(){var P=D.settings.player;return(D.players[P]||[]).filter(function(t){return dk(t)===dk(Date.now())})}

/* ---------- charts ---------- */
function svg(inner){return tint('<svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMid meet" font-family="Arial Black,Arial" font-weight="900" font-size="11">'+inner+'</svg>')}
function axes(max,L,T,W,H,R,B){var s='',st=Math.ceil(max/4);for(var v=0;v<=max;v+=st){var y=T+(1-v/max)*(H-T-B);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#ffffff33"/><text x="'+(L-4)+'" y="'+(y+4)+'" fill="#fff" text-anchor="end">'+v+'</text>'}return s}
function lineChart(ev){
 var W=320,H=150,L=26,R=14,T=14,B=20,now=Date.now(),n=ev.length;
 var t1=Math.max(now,n?ev[n-1]:now),t0=n?ev[0]-Math.max(60000,(t1-ev[0])*.08):now-36e5,max=Math.max(n,4);
 var X=function(t){return L+(t-t0)/(t1-t0)*(W-L-R)},Y=function(c){return T+(1-c/max)*(H-T-B)};
 var tm=function(t){var x=new Date(t);return p2(x.getHours())+':'+p2(x.getMinutes())};
 var P=[[X(t0),Y(0)]];ev.forEach(function(t,i){P.push([X(t),Y(i+1)])});
 if(n&&t1>ev[n-1])P.push([X(t1),Y(n)]);
 var s=axes(max,L,T,W,H,R,B)+'<path d="M'+L+' '+T+' V'+(H-B)+' H'+(W-R)+'" fill="none" stroke="#fff" stroke-width="2"/>';
 if(P.length>1){
  var N=P.length,m=[],sl=[],dx=[],i;
  for(i=0;i<N-1;i++){dx[i]=Math.max(P[i+1][0]-P[i][0],.01);sl[i]=(P[i+1][1]-P[i][1])/dx[i]}
  m[0]=sl[0];m[N-1]=sl[N-2];
  for(i=1;i<N-1;i++)m[i]=sl[i-1]*sl[i]<=0?0:(sl[i-1]+sl[i])/2;
  for(i=0;i<N-1;i++){var a=sl[i];if(a===0){m[i]=0;m[i+1]=0}else{var al=m[i]/a,be=m[i+1]/a,q=al*al+be*be;if(q>9){q=3/Math.sqrt(q);m[i]=q*al*a;m[i+1]=q*be*a}}}
  var d='M'+P[0][0]+' '+P[0][1];
  for(i=0;i<N-1;i++){var h=dx[i]/3;d+=' C'+(P[i][0]+h)+' '+(P[i][1]+m[i]*h)+' '+(P[i+1][0]-h)+' '+(P[i+1][1]-m[i+1]*h)+' '+P[i+1][0]+' '+P[i+1][1]}
  var E=P[N-1];
  s+='<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff700" stop-opacity=".6"/><stop offset="1" stop-color="#ff0a78" stop-opacity="0"/></linearGradient></defs>'+
  '<path d="'+d+' L'+E[0]+' '+Y(0)+' L'+P[0][0]+' '+Y(0)+' Z" fill="url(#gr)"/>'+
  '<path d="'+d+'" fill="none" stroke="#ff0a78" stroke-width="9" stroke-opacity=".45" stroke-linecap="round"/>'+
  '<path d="'+d+'" fill="none" stroke="#fff700" stroke-width="4" stroke-linecap="round"/>'+
  '<circle cx="'+E[0]+'" cy="'+E[1]+'" r="5.5" fill="#fff" stroke="#ff0a78" stroke-width="3"/>'+
  '<text x="'+(E[0]-9)+'" y="'+(E[1]-8)+'" fill="#fff" font-size="14" text-anchor="end">'+n+'</text>';
 }else s+='<text x="'+(W/2)+'" y="'+(H/2)+'" fill="#ffffff99" font-size="14" text-anchor="middle">жми на кнопку</text>';
 return svg(s+'<text x="'+L+'" y="'+(H-4)+'" fill="#00e5ff">'+tm(t0)+'</text><text x="'+(W-R)+'" y="'+(H-4)+'" fill="#00e5ff" text-anchor="end">'+tm(t1)+'</text>');
}
function barChart(rows){
 var W=320,H=150,L=26,R=8,T=10,B=20,n=rows.length,max=Math.max(4,Math.max.apply(null,rows.map(function(r){return r[1]})));
 var bw=(W-L-R)/n,s=axes(max,L,T,W,H,R,B);
 rows.forEach(function(r,i){var h=r[1]/max*(H-T-B);s+='<rect x="'+(L+i*bw+bw*.12)+'" y="'+(H-B-h)+'" width="'+(bw*.76)+'" height="'+h+'" rx="2" fill="'+(i%2?'#ff0a78':'#fff700')+'"/>'});
 s+='<text x="'+L+'" y="'+(H-4)+'" fill="#00e5ff">'+fmtD(rows[0][0])+'</text>';
 if(n>1)s+='<text x="'+(W-R)+'" y="'+(H-4)+'" fill="#00e5ff" text-anchor="end">'+fmtD(rows[n-1][0])+'</text>';
 return svg(s);
}

/* ---------- main screen ---------- */
function render(){
 var P=D.settings.player,t=$('ttl');
 t.textContent='СОПЛИ_'+(P||'?');
 t.style.fontSize=Math.min(15,92/((P.length+6)*.74))+'vw';
 $('btn').textContent=today().length;
 $('ch').innerHTML=lineChart(today());
}
function tick(){var d=new Date();$('dt').textContent=p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+p2(d.getHours())+':'+p2(d.getMinutes())+' '+DAYS[d.getDay()]}
$('btn').onclick=function(){
 if(!D.settings.player){show('settings');return}
 var P=D.settings.player;(D.players[P]=D.players[P]||[]).push(Date.now());save();render();laugh();
 var b=$('btn');b.classList.add('hit');setTimeout(function(){b.classList.remove('hit')},120);
};

/* ---------- swipe down -> menu button ---------- */
var y0=null,hideT;
$('main').addEventListener('pointerdown',function(e){y0=e.clientY});
$('main').addEventListener('pointerup',function(e){
 if(y0!==null&&e.clientY-y0>70){$('pull').classList.add('on');clearTimeout(hideT);hideT=setTimeout(function(){$('pull').classList.remove('on')},5000)}y0=null});
$('pull').onclick=function(){$('pull').classList.remove('on');show('menu')};

/* ---------- panes ---------- */
function show(n){['menu','settings','archive','detail'].forEach(function(p){$(p).classList.toggle('on',p===n)});
 if(n==='settings')renderSettings();if(n==='archive')renderArchive();if(n==='')render()}
document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){show(b.dataset.go)}});

function soundRows(){var S=D.settings;return allSounds().map(function(x){return '<div class="snd'+(S.sound===x.id?' on':'')+'" data-id="'+x.id+'"><span>'+esc(x.name)+'</span>'+(x.custom?'<i class="del" data-del="'+x.id+'">✕</i>':'')+'</div>'}).join('')}
function renderSettings(){
 var S=D.settings,names=Object.keys(D.players);
 $('settings').innerHTML='<h2>НАСТРОЙКА</h2><label>Имя игрока (СОПЛИ_...)</label><input type="text" id="nm" maxlength="12" value="'+esc(S.player)+'">'+
 (names.length?'<div class="chips">'+names.map(function(n){return '<button class="chip" data-n="'+esc(n)+'">'+esc(n)+'</button>'}).join('')+'</div>':'')+
 '<label>Звук смеха (нажми, чтобы выбрать)</label><div id="snds">'+soundRows()+'</div><button class="b g" id="add">➕ ДОБАВИТЬ СВОЙ ЗВУК</button><input type="file" id="fi" accept="audio/*" multiple hidden>'+
 colorUI()+'<label>Длительность смеха: <span id="sv">'+S.sec+'</span> сек</label><input type="range" id="sec" min="1" max="10" step="1" value="'+S.sec+'"><div class="row"><span>1</span><span>10</span></div>'+
 '<label>Тон смеха</label><input type="range" id="pit" min="0" max="100" value="'+S.pitch+'"><div class="row"><span>низкий</span><span>высокий</span></div>'+
 '<button class="b p" id="test" style="margin-top:22px">▶ ПРОВЕРИТЬ СМЕХ</button><button class="b y" id="ok">✔ ГОТОВО</button>';
 $('nm').oninput=function(){this.value=this.value.toUpperCase();S.player=this.value.trim();save()};
 document.querySelectorAll('.chip[data-n]').forEach(function(c){c.onclick=function(){S.player=c.dataset.n;$('nm').value=S.player;save()}});
 document.querySelectorAll('.snd').forEach(function(r){r.onclick=function(e){var dl=e.target.getAttribute('data-del');
  if(dl){if(confirm('Удалить этот звук?'))delCust(dl,function(){if(S.sound===dl){S.sound='b1';save()}renderSettings()});return}
  S.sound=r.dataset.id;save();renderSettings();laugh()}});
 $('add').onclick=function(){$('fi').click()};
 $('fi').onchange=function(){var fs=[].slice.call(this.files),n=fs.length;if(!n)return;
  fs.forEach(function(f){addCust(f,function(id){if(id){S.sound=id;save()}if(--n===0){renderSettings();laugh()}})})};
 document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){S.colors=Object.assign({},PRESETS[+b.dataset.p].c);save();applyColors();render();renderSettings()}});
 document.querySelectorAll('[data-c]').forEach(function(i){i.oninput=function(){S.colors[i.dataset.c]=i.value;save();applyColors();render()}});
 $('rc').onclick=function(){S.colors=Object.assign({},DEFC);save();applyColors();render();renderSettings()};
 $('sec').oninput=function(){S.sec=+this.value;$('sv').textContent=S.sec;save()};
 $('pit').oninput=function(){S.pitch=+this.value;save()};
 $('test').onclick=laugh;$('ok').onclick=function(){show('')};
}
function renderArchive(){
 var names=Object.keys(D.players).filter(function(n){return D.players[n].length});
 $('archive').innerHTML='<h2>АРХИВ</h2>'+(names.length?names.map(function(n){return '<button class="b y pl" data-n="'+esc(n)+'"><span>'+esc(n)+'</span><span>'+D.players[n].length+'</span></button>'}).join(''):'<div class="tot">Пока пусто</div>')+'<button class="b p" id="bk">← НАЗАД</button>';
 document.querySelectorAll('#archive [data-n]').forEach(function(b){b.onclick=function(){renderDetail(b.dataset.n)}});
 $('bk').onclick=function(){show('menu')};
}
function renderDetail(n){
 var m={};D.players[n].forEach(function(t){var k=dk(t);m[k]=(m[k]||0)+1});
 var rows=Object.keys(m).sort().map(function(k){return[k,m[k]]}),mx=Math.max.apply(null,rows.map(function(r){return r[1]}));
 $('detail').innerHTML='<h2>СОПЛИ_'+esc(n)+'</h2><div class="tot">Всего за всё время: '+D.players[n].length+'</div><div class="cht">'+barChart(rows)+'</div>'+
 rows.slice().reverse().map(function(r){return '<div class="dr"><span>'+fmtD(r[0])+'</span><i style="width:'+(r[1]/mx*45)+'vw"></i><b>'+r[1]+'</b></div>'}).join('')+
 '<button class="b p" id="bk2" style="margin-top:18px">← К ИГРОКАМ</button>';
 show('detail');$('bk2').onclick=function(){show('archive')};
}

function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();return AC}
function allSounds(){return BUILTIN.map(function(b){return{id:b.id,name:b.name}}).concat([{id:'syn',name:'Синтезатор'}],CUST.map(function(c){return{id:c.id,name:c.name,custom:true}}))}
function idb(cb){try{var q=indexedDB.open('snot-sounds',1);q.onupgradeneeded=function(){q.result.createObjectStore('s',{keyPath:'id'})};q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb(null)}}catch(e){cb(null)}}
function loadCust(done){idb(function(db){if(!db)return done();try{var r=db.transaction('s').objectStore('s').getAll();r.onsuccess=function(){CUST=r.result||[];done()};r.onerror=function(){done()}}catch(e){done()}})}
function addCust(f,done){var rd=new FileReader();rd.onerror=function(){done(null)};rd.onload=function(){
 var rec={id:'u'+Date.now()+Math.floor(Math.random()*999),name:f.name.replace(/\.[^.]+$/,''),buf:rd.result};
 idb(function(db){if(!db){alert('Не удалось сохранить звук');return done(null)}
  var t=db.transaction('s','readwrite');t.objectStore('s').put(rec);t.oncomplete=function(){CUST.push(rec);done(rec.id)};t.onerror=function(){done(null)}})};rd.readAsArrayBuffer(f)}
function delCust(id,done){idb(function(db){if(!db)return done();var t=db.transaction('s','readwrite');t.objectStore('s').delete(id);t.oncomplete=function(){CUST=CUST.filter(function(c){return c.id!==id});delete BUF[id];done()}})}
function getAB(id,cb){var i;for(i=0;i<BUILTIN.length;i++)if(BUILTIN[i].id===id){var s=atob(BUILTIN[i].data.split(',')[1]),u=new Uint8Array(s.length);for(var j=0;j<s.length;j++)u[j]=s.charCodeAt(j);return cb(u.buffer)}
 for(i=0;i<CUST.length;i++)if(CUST[i].id===id)return cb(CUST[i].buf.slice(0));cb(null)}
function prep(id,ok,fail){if(BUF[id])return ok(BUF[id]);getAB(id,function(ab){if(!ab)return fail();try{ctx().decodeAudioData(ab,function(x){BUF[id]=x;ok(x)},function(){fail()})}catch(e){fail()}})}
function playBuf(buf){var S=D.settings,a=ctx(),s=a.createBufferSource(),g=a.createGain(),t=a.currentTime+.02;
 s.buffer=buf;s.loop=true;s.playbackRate.value=.7+S.pitch/100*.8;
 g.gain.setValueAtTime(1,t);g.gain.setValueAtTime(1,t+S.sec-.15);g.gain.linearRampToValueAtTime(0,t+S.sec);
 s.connect(g);g.connect(a.destination);s.start(t);s.stop(t+S.sec)}
function laugh(){var id=D.settings.sound;
 if(id==='syn'){synth();return}
 prep(id,playBuf,function(){synth()})}
function synth(){
 try{
  var a=ctx();
  var S=D.settings,dur=S.sec,base=75+S.pitch*1.5,k=.85+base/500,T0=a.currentTime+.03;
  var out=a.createGain(),lp=a.createBiquadFilter(),comp=a.createDynamicsCompressor();
  lp.type='lowpass';lp.frequency.value=4200;out.connect(lp);lp.connect(comp);comp.connect(a.destination);

 }catch(e){}
